name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install toolchain
        run: bash scripts/jitpack_setup.sh
      - name: Verify source formatting
        run: |
          python3 -m pip install clang-format==18.1.8
          curl -fSL https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.22.0/google-java-format-1.22.0-all-deps.jar -o /tmp/google-java-format.jar
          python3 scripts/check_format.py --java-format /tmp/google-java-format.jar
      - name: Verify dependencies and core
        run: |
          python3 scripts/verify_vendor.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Build Android and Maven publication
        run: |
          ./scripts/build_android.sh
          cd android
          ./gradlew :sdk:publishReleasePublicationToMavenLocal --no-daemon
      - name: Package
        run: python3 scripts/package_release.py --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/release/*
          retention-days: 14
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Verify Swift formatting
        run: |
          curl -fSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.54.6/swiftformat.zip -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /tmp/mat-swiftformat
          /tmp/mat-swiftformat/swiftformat --lint ios/Demo
      - name: Build unsigned demos and XCFramework
        run: ./scripts/build_ios.sh
      - name: Package
        run: python3 scripts/package_release.py --platform ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/release/*
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Combine artifact checksums
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          out=pathlib.Path('release')
          entries={}
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name not in ['SHA256SUMS','manifest.json']:
                  entries[p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'SHA256SUMS').write_text(''.join(f"{v['sha256']}  {n}\n" for n,v in entries.items()))
          (out/'manifest.json').write_text(json.dumps({'tag':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'files':entries},indent=2)+'\n')
          PY
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "MobileAutoTune $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
