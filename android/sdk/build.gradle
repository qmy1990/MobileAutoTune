plugins { id 'com.android.library'; id 'maven-publish' }

group = System.getenv('GROUP') ?: 'com.github.qmy1990'
version = System.getenv('VERSION') ?: 'v0.5.1'
def sdkSourceRoot = rootProject.projectDir.parentFile
def prepareKeyAnalysis = tasks.register('prepareKeyAnalysis', Exec) {
    workingDir sdkSourceRoot
    commandLine 'python3', 'scripts/prepare_key_analysis.py', '--platform', 'android', '--runtime-only'
}
def prepareNotices = tasks.register('prepareNotices', Sync) {
    from("$sdkSourceRoot/third_party/onnxruntime") {
        include 'LICENSE', 'ThirdPartyNotices*.txt'
        into 'third_party/onnxruntime'
    }
    from("$sdkSourceRoot/third_party/key_models") { into 'third_party/key_models' }
    into layout.buildDirectory.dir('generated/notices')
}
tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake')) {
        task.dependsOn prepareKeyAnalysis
    }
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn prepareNotices
    }
}
android {
    sourceSets { main.assets.srcDir layout.buildDirectory.dir('generated/notices') }
    namespace 'com.moon.mobileautotune'
    compileSdk 34
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 26
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17'; } }
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        consumerProguardFiles 'consumer-rules.pro'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    publishing { singleVariant("release") { withSourcesJar() } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

// Only the SDK is published; the demo remains a sample application.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = System.getenv('ARTIFACT') ?: 'MobileAutoTune'
                version = project.version.toString()
                pom {
                    name = 'MobileAutoTune'
                    description = 'Cross-platform vocal audio processing SDK'
                    url = 'https://github.com/qmy1990/MobileAutoTune'
                    licenses { license { name = 'MIT License'; url = 'https://opensource.org/license/mit/' } }
                    scm { url = 'https://github.com/qmy1990/MobileAutoTune'; connection = 'scm:git:https://github.com/qmy1990/MobileAutoTune.git' }
                }
            }
        }
    }
}
